name: Publish Benefit Atlas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run automated checks
        run: npm test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p _site/assets
          cp index.html styles.css app.js guide.js data.js logic.js .nojekyll _site/
          cp assets/favicon.svg _site/assets/favicon.svg

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
